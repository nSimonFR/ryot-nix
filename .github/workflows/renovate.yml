name: Renovate

# Self-hosted Renovate: bumps the upstream Ryot version pinned in flake.nix,
# then runs ci/renovate-update.sh (postUpgradeTask) to recompute the Nix hashes
# so the PR is build-ready — something the Mend-hosted app cannot do (no Nix).
# Review + merge manually; no auto-merge.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday ~06:17 UTC

permissions:
  contents: write
  pull-requests: write
  issues: write # Dependency Dashboard (:dependencyDashboard) is created as an issue
  actions: write # keepalive: re-enable this workflow (last step)

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install hash tools (nurl + yarn-berry-fetcher)
        run: nix profile install nixpkgs#nurl "nixpkgs#yarn-berry_4.yarn-berry-fetcher"

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_REPOSITORIES: nSimonFR/ryot-nix
          RENOVATE_PLATFORM: github
          # postUpgradeTasks run arbitrary commands, so the runner (not repo
          # config) must allow-list them — a repo cannot self-grant execution.
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["^bash ci/renovate-update\\.sh "]'
          LOG_LEVEL: info
        run: npx --yes renovate

      - name: Keep the schedule alive
        # GitHub turns scheduled workflows off after 60 days without a commit
        # (ryot-nix and beaverhabits-nix went dark that way in 2026-10).
        # Re-enabling through the API resets that timer, with no dummy commit.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/renovate.yml/enable"
